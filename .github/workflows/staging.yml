name: Staging (GitHub Pages)

# Nxord no tiene host propio. `dev` y `production` publican el mismo sitio
# https://<owner>.github.io/nxord/. El último push reemplaza al otro.
# `vite` usa base `./`, así que los assets funcionan en esa ruta.
# `main` no despliega.
#
# Primera vez: Settings → Pages → Source = GitHub Actions.

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_YGGDRA_API_BASE: https://api.yggdra.cl/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        run: npm run build

      - name: Preparar artefactos de Pages
        run: |
          set -euo pipefail
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
